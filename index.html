<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="NTHU Study Notes — a reusable beginner-friendly EECS learning library.">
<title>NTHU Study Notes | Kenshin Hara</title>
<style>
:root{color-scheme:dark;--bg:#0b1324;--surface:#17243b;--surface2:#202f49;--line:#33445f;--text:#f1f6ff;--muted:#adbed4;--accent:#75dcce;--blue:#9cbcff;--yellow:#f9d68b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 95% 3%,#173d53 0,transparent 29%),radial-gradient(circle at 8% 46%,#152d48 0,transparent 35%),var(--bg);color:var(--text);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}.wrap{width:min(1080px,calc(100% - 36px));margin:auto}header{border-bottom:1px solid var(--line);background:#0b1324bb;backdrop-filter:blur(12px)}.top{display:flex;align-items:center;justify-content:space-between;min-height:78px;gap:14px}.brand{font-size:1.15rem;font-weight:800;letter-spacing:-.03em}.brand span{color:var(--accent)}.top nav{display:flex;gap:24px;color:var(--muted);font-size:.92rem}nav a:hover,.textlink:hover{color:var(--accent)}.hero{padding:77px 0 57px}.eyebrow{display:inline-flex;border:1px solid #376769;border-radius:99px;color:var(--accent);background:#132d37;padding:5px 14px;font-size:.78rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase}h1{font-size:clamp(2.7rem,7vw,5rem);line-height:1.12;letter-spacing:-.055em;max-width:830px;margin:21px 0}h1 em{font-style:normal;color:var(--accent)}.lead{font-size:1.1rem;color:var(--muted);max-width:675px}.pillrow{display:flex;flex-wrap:wrap;gap:11px;margin-top:28px}.pill{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:#15243a;color:#c7d7e9;font-size:.88rem}.bar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:15px 0 23px;flex-wrap:wrap}h2{font-size:1.6rem;letter-spacing:-.03em;margin:0}.small{font-size:.85rem;color:var(--muted)}.search{background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px 16px;min-width:min(100%,310px);outline-offset:3px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:23px}.filter{border:1px solid var(--line);border-radius:10px;padding:8px 13px;background:transparent;color:var(--muted)}.filter.active,.filter:hover{border-color:var(--accent);color:#082026;background:var(--accent)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:19px}.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:19px;background:linear-gradient(145deg,#1c2e47,var(--surface));padding:25px;min-height:290px;transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-4px);border-color:var(--accent)}.meta{display:flex;gap:8px;flex-wrap:wrap}.tag{color:var(--accent);background:#103b40;padding:3px 9px;border-radius:7px;font-size:.74rem;font-weight:700}.level{color:var(--blue);background:#263856;padding:3px 9px;border-radius:7px;font-size:.74rem}.card h3{font-size:1.3rem;line-height:1.3;margin:23px 0 8px;letter-spacing:-.025em}.card p{color:var(--muted);font-size:.94rem;margin:0 0 28px}.textlink{margin-top:auto;color:var(--accent);font-weight:750}.feature{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:65px 0;padding:30px;border:1px solid var(--line);border-radius:18px;background:#142439}.feature h2{margin-bottom:10px}.feature p{color:var(--muted);margin:0}.steps{margin:0;padding-left:22px;color:#c8d7e7}.steps li{padding:5px 0}.note{max-width:850px;margin:50px auto 80px}.back{display:inline-block;color:var(--accent);margin-bottom:28px}.note h1{font-size:clamp(2.3rem,5vw,3.8rem)}.note .lead{margin-bottom:30px}.section{background:var(--surface);padding:25px 28px;border:1px solid var(--line);border-radius:18px;margin:16px 0}.section h2{font-size:1.15rem;color:var(--accent);margin-bottom:12px}.section p{margin:0;color:#dce8f8}.reveal{margin-top:18px;background:var(--accent);color:#0b2025;border:0;border-radius:10px;padding:9px 15px;font-weight:800}.answer{margin-top:15px!important;border-top:1px solid var(--line);padding-top:14px}.hidden{display:none}.empty{color:var(--muted);padding:36px;border:1px dashed var(--line);border-radius:12px}footer{border-top:1px solid var(--line);padding:25px 0 35px;color:var(--muted);font-size:.87rem}.footerin{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
@media(max-width:720px){.hero{padding:55px 0 38px}.cards,.feature{grid-template-columns:1fr}.top nav{gap:12px;font-size:.8rem}.card{min-height:225px}.feature{margin:45px 0}.note{margin-top:32px}.section{padding:20px}.search{width:100%}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{transition:none}}
</style>
</head>
<body>
<header><div class="wrap top"><a class="brand" href="#">NTHU <span>Study Notes.</span></a><nav aria-label="Main navigation"><a href="#">Home</a><a href="#about">About project</a><a href="https://github.com/kenshin1125/test-codex" target="_blank" rel="noopener noreferrer">GitHub ↗</a></nav></div></header>
<main class="wrap" id="app"></main>
<footer><div class="wrap footerin"><span>Made by Kenshin Hara · NTHU IBP · EECS</span><span>Independent student learning resource · 2026</span></div></footer>
<script>
/* AI AGENTS: Read AGENTS.md before making changes. Add topics only through this data array. */
const notes=[
{slug:"pipeline-basics",subject:"Computer Architecture",title:"How CPU Pipelining Works",level:"Beginner",summary:"Why processors divide instructions into stages and what a pipeline hazard means.",concept:"A CPU pipeline overlaps the work of several instructions, much like an assembly line. A classic five-stage pipeline uses Instruction Fetch (IF), Instruction Decode (ID), Execute (EX), Memory Access (MEM), and Write Back (WB). Pipelining can improve throughput, but it does not necessarily shorten the latency of one instruction. Data, control, and structural hazards can cause stalls.",example:"Imagine five instructions, each needing five one-cycle stages. Without overlap, they take 25 cycles. In an ideal five-stage pipeline, they complete in 5 + (5 - 1) = 9 cycles. Real processors can take longer because of hazards.",question:"Does an ideal pipeline make each individual instruction finish in fewer stages?",answer:"No. It mainly improves throughput by overlapping instructions. A single instruction still passes through its required stages."},
{slug:"sr-latch",subject:"Logic Design",title:"Understanding the SR Latch",level:"Beginner",summary:"A first step toward sequential circuits, memory and next-state logic.",concept:"An SR latch stores one bit using feedback. S means Set and R means Reset. For an active-high NOR SR latch, S=1 and R=0 makes Q=1; S=0 and R=1 makes Q=0. When both are 0, it keeps its previous value. The input combination S=R=1 is invalid for the standard NOR-latch model.",example:"If Q is currently 0, briefly apply S=1 and R=0. Q becomes 1. Return both inputs to 0, and the latch remembers Q=1.",question:"For a NOR SR latch, what happens at S=0 and R=0?",answer:"It holds its previous state. The feedback paths preserve the stored bit."},
{slug:"conditional-probability",subject:"Probability",title:"Conditional Probability Made Simple",level:"Beginner",summary:"Understand how knowing one event changes the chance of another.",concept:"Conditional probability measures the probability of event A when event B is known to have happened. The formula is P(A|B) = P(A ∩ B) / P(B), provided P(B) > 0. The denominator narrows the sample space to cases where B occurs. Do not confuse P(A|B) with P(B|A).",example:"A bag contains 3 red balls and 2 blue balls. If the first ball drawn without replacement is red, then 2 red and 2 blue balls remain. The chance the second is red is 2/4 = 1/2.",question:"If P(A ∩ B)=0.2 and P(B)=0.5, what is P(A|B)?",answer:"P(A|B) = 0.2 / 0.5 = 0.4, or 40%."},
{slug:"machine-learning-overfitting",subject:"Machine Learning",title:"What Is Overfitting?",level:"Beginner",summary:"Learn why excellent training accuracy may not mean a useful model.",concept:"Overfitting happens when a model learns patterns that are too specific to its training data, including noise. It can achieve high training accuracy while performing poorly on unseen examples. Common ways to reduce overfitting include collecting more representative data, regularization, using a simpler model and early stopping. Evaluate using data kept separate from training.",example:"A model memorizes 100 training images and scores 100% on them, but correctly predicts only 60% of new images. The difference suggests that it does not generalize well.",question:"Which is more useful for measuring generalization: training accuracy or performance on unseen test data?",answer:"Performance on unseen test data, assuming the test set was kept independent during training and model selection."}
];
const app=document.getElementById("app");let currentSubject="All";let currentQuery="";
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function card(n){return `<a class="card" href="#note/${encodeURIComponent(n.slug)}"><div class="meta"><span class="tag">${escapeHTML(n.subject)}</span><span class="level">${escapeHTML(n.level)}</span></div><h3>${escapeHTML(n.title)}</h3><p>${escapeHTML(n.summary)}</p><span class="textlink">Read note →</span></a>`}
function updateCards(){const filtered=notes.filter(n=>(currentSubject==="All"||n.subject===currentSubject)&&[n.title,n.subject,n.summary].join(" ").toLowerCase().includes(currentQuery));const el=document.getElementById("cards");if(el)el.innerHTML=filtered.length?filtered.map(card).join(""):'<p class="empty">No notes found. Try another search or subject.</p>';const count=document.getElementById("count");if(count)count.textContent=filtered.length+" notes"}
function home(){const subjects=["All",...new Set(notes.map(n=>n.subject))];app.innerHTML=`<section class="hero"><span class="eyebrow">A reusable student knowledge base</span><h1>Small notes.<br><em>Big understanding.</em></h1><p class="lead">A simple library for learning EECS concepts, one explanation at a time. Each note includes an example and a quick question to check your understanding.</p><div class="pillrow"><span class="pill">📘 NTHU · IBP EECS</span><span class="pill">⚡ Easy to extend with AI</span><span class="pill">✏️ Beginner-friendly</span></div></section><section aria-label="Study notes"><div class="bar"><div><h2>Explore the notes</h2><div class="small" id="count"></div></div><input class="search" id="search" type="search" placeholder="Search a topic..." aria-label="Search notes" value="${escapeHTML(currentQuery)}"></div><div class="filters" id="filters" aria-label="Filter by subject">${subjects.map(s=>`<button type="button" class="filter ${currentSubject===s?"active":""}" data-subject="${escapeHTML(s)}">${escapeHTML(s)}</button>`).join("")}</div><div class="cards" id="cards"></div></section><section class="feature" id="about"><div><span class="eyebrow">Built to grow</span><h2>One system. More pages.</h2><p>This project uses AGENTS.md to explain the content format, design rules and how an AI assistant should add future lessons.</p></div><ol class="steps"><li>Choose a new EECS topic.</li><li>Follow the note structure in AGENTS.md.</li><li>Add one note object to the content collection.</li><li>The website creates a new searchable page automatically.</li></ol></section>`;document.getElementById("search").addEventListener("input",e=>{currentQuery=e.target.value.toLowerCase().trim();updateCards()});document.querySelectorAll("[data-subject]").forEach(btn=>btn.addEventListener("click",()=>{currentSubject=btn.dataset.subject;document.querySelectorAll("[data-subject]").forEach(b=>b.classList.toggle("active",b===btn));updateCards()}));updateCards()}
function notePage(slug){const n=notes.find(x=>x.slug===slug);if(!n){app.innerHTML='<div class="note"><a href="#" class="back">← All notes</a><h1>Note not found</h1><p>This note does not exist.</p></div>';return}app.innerHTML=`<article class="note"><a href="#" class="back">← Back to all notes</a><div class="meta"><span class="tag">${escapeHTML(n.subject)}</span><span class="level">${escapeHTML(n.level)}</span></div><h1>${escapeHTML(n.title)}</h1><p class="lead">${escapeHTML(n.summary)}</p><section class="section"><h2>01 / The idea</h2><p>${escapeHTML(n.concept)}</p></section><section class="section"><h2>02 / Worked example</h2><p>${escapeHTML(n.example)}</p></section><section class="section"><h2>03 / Quick check</h2><p>${escapeHTML(n.question)}</p><button type="button" class="reveal" id="reveal" aria-expanded="false" aria-controls="answer">Show answer</button><p class="answer hidden" id="answer">${escapeHTML(n.answer)}</p></section></article>`;document.getElementById("reveal").addEventListener("click",e=>{const ans=document.getElementById("answer");const visible=!ans.classList.toggle("hidden");e.target.textContent=visible?"Hide answer":"Show answer";e.target.setAttribute("aria-expanded",String(visible))})}
function render(){const hash=decodeURIComponent(location.hash.slice(1));if(hash.startsWith("note/"))notePage(hash.slice(5));else home();window.scrollTo({top:0,behavior:"instant"})}window.addEventListener("hashchange",render);render();
</script>
</body></html>
